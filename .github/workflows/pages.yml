name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only reviewed main-branch code may read the private diagram compiler.
    if: github.repository == 'jtauber/dromaios' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: site-build
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out the pinned diagram compiler
        uses: actions/checkout@v7
        with:
          repository: jtauber/sauvignon-new
          ref: b5a85cad3179e7cb087ee785c17b6547d2e80efd
          path: .site-dependencies/sauvignon
          ssh-key: ${{ secrets.SAUVIGNON_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.8"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: site/uv.lock
      - name: Check the publishing code
        run: npm run test:site
      - name: Read the Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - name: Build and check every page, diagram, and local link
        env:
          SAUVIGNON_PATH: ${{ github.workspace }}/.site-dependencies/sauvignon
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        # GitHub returns an empty base for a custom domain and /dromaios for
        # the default project URL. The builder expects a trailing slash.
        run: npm run build:site -- --base "${SITE_BASE%/}/"
      - name: Upload only the public site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish microcomputer.world
        id: deployment
        uses: actions/deploy-pages@v5
