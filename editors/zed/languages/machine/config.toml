name = "Dromaios Machine"
grammar = "dromaios_machine"
path_suffixes = ["machine"]
line_comments = ["// "]
tab_size = 4
autoclose_before = "}]"
brackets = [
    { start = "{", end = "}", close = true, newline = true, not_in = ["comment"] },
    { start = "[", end = "]", close = true, newline = false, not_in = ["comment"] },
]
