name = "Dromaios CPU"
grammar = "dromaios_cpu"
path_suffixes = ["cpu"]
code_fence_block_name = "cpu"
line_comments = ["// "]
tab_size = 2
autoclose_before = "}]),"
brackets = [
    { start = "{", end = "}", close = true, newline = true, not_in = ["comment", "string"] },
    { start = "[", end = "]", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "(", end = ")", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
]
