{% macro run_speed() %}
<div class="basic-controls execution-speed" role="group" aria-label="Run speed">
  <button type="button" data-machine-speed="normal" aria-pressed="true" disabled>Normal</button>
  <button type="button" data-machine-speed="unlimited" aria-pressed="false" disabled>Unlimited</button>
</div>
{% endmacro %}

{% macro clock_measurements() %}
<div class="basic-controls" role="group" aria-label="Clock marker">
  <button type="button" data-clock-mark disabled>Mark clock</button>
  <button type="button" data-clock-clear disabled>Clear marker</button>
</div>
<p data-clock-elapsed class="basic-readout" role="status">No clock marker.</p>
<p data-clock-interval class="basic-readout" role="status" hidden></p>
{% endmacro %}
