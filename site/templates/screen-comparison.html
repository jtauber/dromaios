<p class="basic-readout" data-screen-comparison-status role="status"></p>
<div class="lab-screen-comparison" data-screen-comparison hidden>
  <div class="lab-comparison-map">
    <canvas data-comparison-map aria-label="Changed screen dots highlighted in amber" title="Click a highlighted dot to inspect it"></canvas>
    <span class="lab-pixel-marker" data-comparison-marker aria-hidden="true"></span>
  </div>
  <div class="basic-controls">
    <button type="button" data-comparison-inspect></button>
    <button type="button" data-comparison-prev aria-label="Previous changed dot" title="Previous changed dot">‹</button>
    <button type="button" data-comparison-next aria-label="Next changed dot" title="Next changed dot">›</button>
    <output class="basic-readout" data-comparison-colours></output>
  </div>
</div>
