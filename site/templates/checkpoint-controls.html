<h2>Saved checkpoints</h2>
<form data-checkpoint-form class="lab-state-form">
  <label>Name <input data-checkpoint-name maxlength="80" required autocomplete="off" disabled></label>
  <button type="submit" data-save disabled>Save new checkpoint</button>
</form>
<label>Saved checkpoint <select data-checkpoint-choice disabled></select></label>
<div class="basic-controls"><button type="button" data-restore disabled>Restore</button>
  <button type="button" data-remove disabled>Delete checkpoint</button></div>
<p class="basic-message" role="status" data-saved></p>
